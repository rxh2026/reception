<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本人確認フォーム</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:"Yu Gothic",sans-serif;
background:linear-gradient(135deg,#d2c3ff 0%,#bea8ff 45%,#a789f0 100%);
padding:60px 18px;
color:#222;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#fff;
padding:38px;
border-radius:24px;
margin-bottom:28px;
box-shadow:0 8px 25px rgba(76,32,155,.15);
}

.topline{
height:8px;
background:#6d3cc8;
margin:-38px -38px 30px;
border-radius:14px 14px 0 0;
}

h1{
font-size:42px;
margin-bottom:20px;
line-height:1.4;
}

h2{
font-size:30px;
margin-bottom:18px;
color:#5b33b2;
}

.note{
line-height:1.9;
font-size:18px;
margin-bottom:15px;
}

.notice{
font-size:16px;
line-height:1.8;
color:#555;
margin-top:16px;
}

label{
display:block;
font-weight:bold;
margin-top:22px;
margin-bottom:10px;
font-size:18px;
}

input,select,textarea{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
}

textarea{
min-height:110px;
}

.radio-group{
display:flex;
flex-direction:column;
gap:14px;
margin-top:12px;
}

.radio-group label{
display:flex;
align-items:center;
gap:12px;
margin:0;
font-weight:normal;
}

.radio-group input{
width:auto;
margin:0;
}

.checkbox-row{
display:flex;
align-items:center;
gap:12px;
margin-top:20px;
font-size:18px;
font-weight:bold;
}

.checkbox-row input{
width:auto;
}

button{
width:100%;
padding:18px;
background:#6d3cc8;
color:#fff;
border:none;
border-radius:14px;
font-size:18px;
margin-top:35px;
cursor:pointer;
}

.small{
font-size:14px;
color:#666;
margin-top:8px;
}

@media(max-width:768px){

body{
padding-top:78px;
padding-left:16px;
padding-right:16px;
}

.card{
padding:28px;
}

.topline{
margin:-28px -28px 24px;
}

h1{font-size:28px;}
h2{font-size:24px;}
.note{font-size:16px;}
.notice{font-size:14px;}
label{font-size:16px;}

}
</style>


<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbwh5u1LSDMJccA1FNo6T7AvTBADOeGyPpCmn6H69XMSC1xhe7XgQ7OeomhkXh1WNoI/exec";


async function searchAddress(){

let zip=zipcode.value.replace("-","");

if(zip.length!==7)return;

try{

const res=
await fetch(
"https://zipcloud.ibsnet.co.jp/api/search?zipcode="+zip
);

const data=await res.json();

if(data.results){

pref.value=data.results[0].address1;

city.value=
data.results[0].address2+
data.results[0].address3;

}

}catch(e){}

}



async function submitForm(e){

e.preventDefault();

if(!agree.checked){
alert("個人情報の取り扱いに同意してください");
return;
}

let fileInput=idfile.files[0];

if(!fileInput){
alert("本人確認書類を添付してください");
return;
}

let base64=
await new Promise(resolve=>{

let reader=new FileReader();

reader.onload=function(){
resolve(reader.result.split(",")[1]);
};

reader.readAsDataURL(fileInput);

});


const payload={

movein:movein.value,
parking:document.querySelector('input[name="parking"]:checked').value,
cycle:document.querySelector('input[name="cycle"]:checked').value,
bike:document.querySelector('input[name="bike"]:checked').value,
pet:document.querySelector('input[name="pet"]:checked').value,

lastName:lastName.value,
firstName:firstName.value,
lastKana:lastKana.value,
firstKana:firstKana.value,
gender:gender.value,
birth:birth.value,
tel:tel.value,
email:email.value,
spouse:spouse.value,
family:family.value,

zipcode:zipcode.value,
pref:pref.value,
city:city.value,
address1:address1.value,
address2:address2.value,
houseType:houseType.value,
rent:rent.value,
years:years.value,
reason:reason.value,

company:company.value,
companyKana:companyKana.value,
companyAddress:companyAddress.value,
companyTel:companyTel.value,
employeeCount:employeeCount.value,
income:income.value,
workYears:workYears.value,
job:job.value,
industry:industry.value,
department:department.value,

emergencyName:emergencyName.value,
emergencyKana:emergencyKana.value,
relationship:relationship.value,
emergencyTel:emergencyTel.value,
emergencyAddress:emergencyAddress.value,

file:base64,
fileName:fileInput.name,
fileType:fileInput.type

};

await fetch(
GAS_URL,
{
method:"POST",
body:JSON.stringify(payload)
}
);

window.location.href="thanks.html";

}
</script>

</head>
<body>

<div class="container">

<form id="myForm" onsubmit="submitForm(event)">

<div class="card">

<div class="topline"></div>

<h1>本人確認フォーム</h1>

<p class="note">
以下の内容をご入力ください。<br>
内容確認後、担当者よりご連絡いたします。
</p>

<div class="notice">
※入力内容に不備がある場合は審査が遅れる場合があります。<br>
※別で追加書類のご案内をさせていただく場合もございますので、ご了承ください。
</div>

</div>


<div class="card">

<h2>個人情報の取り扱い</h2>

<p class="note">
ご入力いただいた個人情報は、賃貸契約に関する審査・連絡の目的のみに使用いたします。
</p>

<label class="checkbox-row">
<input id="agree" type="checkbox" required>
同意する
</label>

</div>


<div class="card">

<h2>賃貸条件</h2>

<label>入居希望日</label>
<input id="movein" type="date" required>

<label>駐車場</label>
<div class="radio-group">
<label><input type="radio" name="parking" value="希望する" required>希望する</label>
<label><input type="radio" name="parking" value="希望しない">希望しない</label>
</div>

<label>駐輪場</label>
<div class="radio-group">
<label><input type="radio" name="cycle" value="希望する" required>希望する</label>
<label><input type="radio" name="cycle" value="希望しない">希望しない</label>
</div>

<label>バイク置き場</label>
<div class="radio-group">
<label><input type="radio" name="bike" value="希望する" required>希望する</label>
<label><input type="radio" name="bike" value="希望しない">希望しない</label>
</div>

<label>ペット</label>
<div class="radio-group">
<label><input type="radio" name="pet" value="あり" required>あり</label>
<label><input type="radio" name="pet" value="なし">なし</label>
</div>

</div>


<div class="card">
<h2>契約者情報</h2>

<label>姓</label><input id="lastName" required>
<label>名</label><input id="firstName" required>
<label>フリガナ（姓）</label><input id="lastKana" required>
<label>フリガナ（名）</label><input id="firstKana" required>

<label>性別</label>
<select id="gender" required>
<option value="">選択してください</option>
<option>男性</option>
<option>女性</option>
</select>

<label>生年月日</label>
<input id="birth" type="date" required>

<label>電話番号</label>
<input id="tel" required>

<label>メールアドレス</label>
<input id="email" type="email" required>

<label>配偶者</label>
<select id="spouse" required>
<option value="">選択してください</option>
<option>あり</option>
<option>なし</option>
</select>

<label>家族構成</label>
<input id="family" required>

</div>


<div class="card">
<h2>現住所</h2>

<label>郵便番号</label>
<input id="zipcode" onkeyup="searchAddress()" required>

<label>都道府県</label>
<input id="pref" required>

<label>市区町村</label>
<input id="city" required>

<label>番地</label>
<input id="address1" required>

<label>建物・部屋番号</label>
<input id="address2" required>

<label>現住居形態</label>
<select id="houseType" required>
<option value="">選択してください</option>
<option>賃貸</option>
<option>持家</option>
<option>社宅</option>
<option>実家</option>
</select>

<label>現在の家賃</label>
<input id="rent" required>

<label>居住年数</label>
<input id="years" required>

<label>転居理由</label>
<textarea id="reason" required></textarea>

</div>


<div class="card">
<h2>勤務先情報</h2>

<label>勤務先名</label><input id="company" required>
<label>フリガナ</label><input id="companyKana" required>
<label>勤務先住所</label><input id="companyAddress" required>
<label>電話番号</label><input id="companyTel" required>
<label>従業員数</label><input id="employeeCount" required>
<label>年収</label><input id="income" required>
<label>勤続年数</label><input id="workYears" required>
<label>職業</label><input id="job" required>
<label>業種</label><input id="industry" required>
<label>所属部署</label><input id="department" required>

</div>


<div class="card">
<h2>緊急連絡先</h2>

<label>氏名</label><input id="emergencyName" required>
<label>フリガナ</label><input id="emergencyKana" required>
<label>続柄</label><input id="relationship" required>
<label>電話番号</label><input id="emergencyTel" required>
<label>住所</label><input id="emergencyAddress" required>

</div>


<div class="card">

<h2>本人確認書類提出</h2>

<label>本人確認書類</label>
<input type="file" id="idfile" required>

<p class="small">
運転免許証・マイナンバー（表面）・パスポート等
</p>

<button type="submit">
送信する
</button>

</div>

</form>

</div>

</body>
</html>
