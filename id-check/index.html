<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本人確認フォーム</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:"Yu Gothic",sans-serif;
background:linear-gradient(
135deg,
#d7cbff 0%,
#c3b1ff 45%,
#b39af5 100%
);
padding:55px 18px 40px;
color:#222;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#fff;
border-radius:24px;
padding:38px;
margin-bottom:30px;
box-shadow:0 10px 28px rgba(78,37,150,.15);
}

.topline{
height:9px;
background:#6d3cc8;
border-radius:14px 14px 0 0;
margin:-38px -38px 34px;
}

h1{
font-size:42px;
line-height:1.35;
margin-bottom:18px;
word-break:keep-all;
}

h2{
font-size:30px;
margin-bottom:20px;
color:#5b33b2;
line-height:1.35;
word-break:keep-all;
}

.note{
line-height:1.9;
font-size:18px;
}

label{
display:block;
font-weight:bold;
margin-top:26px;
margin-bottom:10px;
font-size:18px;
}

input,select,textarea{
width:100%;
padding:16px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
background:#fff;
}

textarea{
min-height:120px;
}

.radio-group{
margin-top:8px;
}

.radio-group label{
font-weight:normal;
margin:12px 0;
}

button{
background:#6d3cc8;
color:#fff;
border:none;
padding:18px 40px;
font-size:20px;
border-radius:14px;
cursor:pointer;
margin-top:35px;
width:100%;
}

.small{
font-size:14px;
color:#666;
margin-top:8px;
}

/* スマホ最適化 */
@media(max-width:768px){

body{
padding-top:72px;
padding-left:16px;
padding-right:16px;
}

.card{
padding:28px;
border-radius:22px;
}

.topline{
margin:-28px -28px 26px;
}

h1{
font-size:28px;
line-height:1.5;
white-space:normal;
}

h2{
font-size:24px;
line-height:1.45;
}

.note{
font-size:16px;
}

label{
font-size:16px;
}

input,select,textarea{
padding:14px;
font-size:16px;
}

button{
font-size:18px;
padding:16px;
}

}

</style>


<script>
async function searchAddress(){

let zip=document.getElementById("zipcode").value.replace("-","");

if(zip.length!==7) return;

try{

const res=await fetch(
"https://zipcloud.ibsnet.co.jp/api/search?zipcode="+zip
);

const data=await res.json();

if(data.results){

document.getElementById("pref").value=
data.results[0].address1;

document.getElementById("city").value=
data.results[0].address2 +
data.results[0].address3;

}

}catch(e){}

}
</script>

</head>
<body>

<div class="container">

<div class="card">
<div class="topline"></div>

<h1>本人確認フォーム</h1>

<p class="note">
以下の内容をご入力ください。<br>
内容確認後、担当者よりご連絡いたします。
</p>

</div>



<form>

<div class="card">

<h2>個人情報の取り扱い</h2>

<label>
<input type="checkbox"
required
style="width:auto;margin-right:10px;">
同意する
</label>

</div>



<div class="card">

<h2>賃貸条件</h2>

<label>入居希望日</label>
<input type="date">

<label>駐車場</label>
<div class="radio-group">
<label><input type="radio" name="parking"> 希望する</label>
<label><input type="radio" name="parking"> 希望しない</label>
</div>

<label>駐輪場</label>
<div class="radio-group">
<label><input type="radio" name="cycle"> 希望する</label>
<label><input type="radio" name="cycle"> 希望しない</label>
</div>

<label>バイク置き場</label>
<div class="radio-group">
<label><input type="radio" name="bike"> 希望する</label>
<label><input type="radio" name="bike"> 希望しない</label>
</div>

<label>ペット</label>
<div class="radio-group">
<label><input type="radio" name="pet"> あり</label>
<label><input type="radio" name="pet"> なし</label>
</div>

</div>



<div class="card">

<h2>現住所</h2>

<label>郵便番号</label>
<input
id="zipcode"
type="text"
placeholder="1234567"
onkeyup="searchAddress()"
>

<label>都道府県</label>
<input id="pref" type="text">

<label>市区町村</label>
<input id="city" type="text">

<label>番地</label>
<input type="text">

<label>建物・部屋番号</label>
<input type="text">

</div>



<div class="card">

<h2>勤務先情報</h2>

<label>勤務先名</label>
<input type="text">

<label>所属部署</label>
<input type="text">

</div>



<div class="card">

<h2>緊急連絡先</h2>

<label>氏名</label>
<input type="text">

<label>フリガナ</label>
<input type="text">

<label>続柄</label>
<input type="text">

<label>電話番号</label>
<input type="text">

</div>



<div class="card">

<h2>本人確認書類提出</h2>

<label>本人確認書類アップロード</label>
<input type="file">

<p class="small">
運転免許証・マイナンバー・パスポート等
</p>

<button type="submit">
送信する
</button>

</div>

</form>
</div>

</body>
</html>
