<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本人確認フォーム</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:"Yu Gothic",sans-serif;
background:linear-gradient(135deg,#ede7ff,#d9c8ff,#c8b3ff);
padding:30px;
color:#222;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#fff;
border-radius:18px;
padding:35px;
margin-bottom:28px;
box-shadow:0 8px 24px rgba(73,33,145,.12);
}

.topline{
height:8px;
background:#6d3cc8;
border-radius:10px 10px 0 0;
margin:-35px -35px 30px;
}

h1{
font-size:42px;
margin-bottom:18px;
}

.note{
line-height:1.8;
font-size:18px;
}

h2{
font-size:32px;
margin-bottom:18px;
color:#5d30b4;
}

label{
display:block;
font-weight:bold;
margin-top:26px;
margin-bottom:10px;
font-size:18px;
}

input,select,textarea{
width:100%;
padding:16px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

textarea{min-height:120px}

.radio-group{
margin-top:10px;
}

.radio-group label{
font-weight:normal;
margin:12px 0;
}

button{
background:#6d3cc8;
color:#fff;
border:none;
padding:18px 40px;
font-size:20px;
border-radius:12px;
cursor:pointer;
margin-top:35px;
}

button:hover{
opacity:.9;
}

.small{
font-size:14px;
color:#666;
margin-top:8px;
}
</style>

<script>
async function searchAddress(){
let zip=document.getElementById("zipcode").value.replace("-","");
if(zip.length!==7) return;

try{
const res=await fetch(
"https://zipcloud.ibsnet.co.jp/api/search?zipcode="+zip
);
const data=await res.json();

if(data.results){
document.getElementById("pref").value=
data.results[0].address1;

document.getElementById("city").value=
data.results[0].address2+
data.results[0].address3;
}
}catch(e){}
}
</script>

</head>
<body>

<div class="container">

<div class="card">
<div class="topline"></div>
<h1>本人確認フォーム</h1>

<p class="note">
以下の内容をご入力ください。<br>
内容確認後、担当者よりご連絡いたします。
</p>
</div>


<form>

<div class="card">
<h2>個人情報の取り扱い</h2>

<label>
<input type="checkbox" required style="width:auto;margin-right:10px;">
同意する
</label>
</div>



<div class="card">
<h2>賃貸条件</h2>

<label>入居希望日</label>
<input type="date">

<label>駐車場</label>
<div class="radio-group">
<label><input type="radio" name="parking"> 希望する</label>
<label><input type="radio" name="parking"> 希望しない</label>
</div>

<label>駐輪場</label>
<div class="radio-group">
<label><input type="radio" name="cycle"> 希望する</label>
<label><input type="radio" name="cycle"> 希望しない</label>
</div>

<label>バイク置き場</label>
<div class="radio-group">
<label><input type="radio" name="bike"> 希望する</label>
<label><input type="radio" name="bike"> 希望しない</label>
</div>

<label>ペット</label>
<div class="radio-group">
<label><input type="radio" name="pet"> あり</label>
<label><input type="radio" name="pet"> なし</label>
</div>

</div>



<div class="card">
<h2>契約者情報</h2>

<label>姓</label>
<input type="text">

<label>名</label>
<input type="text">

<label>フリガナ（姓）</label>
<input type="text">

<label>フリガナ（名）</label>
<input type="text">

<label>性別</label>
<select>
<option>男性</option>
<option>女性</option>
</select>

<label>生年月日</label>
<input type="date">

<label>電話番号</label>
<input type="tel">

<label>メールアドレス</label>
<input type="email">

<label>配偶者</label>
<select>
<option>あり</option>
<option>なし</option>
</select>

<label>家族構成</label>
<input type="text">

</div>



<div class="card">
<h2>現住所</h2>

<label>郵便番号</label>
<input
id="zipcode"
type="text"
placeholder="1234567"
onkeyup="searchAddress()"
>

<label>都道府県</label>
<input id="pref" type="text">

<label>市区町村</label>
<input id="city" type="text">

<label>番地</label>
<input type="text">

<label>建物・部屋番号</label>
<input type="text">

<label>現住居形態</label>
<select>
<option>賃貸</option>
<option>持家</option>
<option>社宅</option>
<option>実家</option>
</select>

<label>現在の家賃</label>
<input type="text">

<label>居住年数</label>
<input type="text">

<label>転居理由</label>
<textarea></textarea>

</div>



<div class="card">
<h2>勤務先情報</h2>

<label>勤務先名</label>
<input type="text">

<label>フリガナ</label>
<input type="text">

<label>勤務先住所</label>
<input type="text">

<label>電話番号</label>
<input type="text">

<label>従業員数</label>
<input type="text">

<label>年収</label>
<input type="text">

<label>勤続年数</label>
<input type="text">

<label>職業</label>
<input type="text">

<label>業種</label>
<input type="text">

<label>所属部署</label>
<input type="text">

</div>



<div class="card">
<h2>緊急連絡先</h2>

<label>氏名</label>
<input type="text">

<label>フリガナ</label>
<input type="text">

<label>続柄</label>
<input type="text">

<label>電話番号</label>
<input type="text">

<label>住所</label>
<input type="text">

</div>



<div class="card">
<h2>本人確認書類提出</h2>

<label>本人確認書類アップロード</label>
<input type="file">

<p class="small">
運転免許証・マイナンバー（表面）・パスポート等
</p>

<button type="submit">
送信する
</button>

</div>

</form>
</div>

</body>
</html>
