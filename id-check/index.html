<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本人確認フォーム</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:"Yu Gothic",sans-serif;
background:linear-gradient(
135deg,#d2c3ff,#bea8ff,#a789f0
);
padding:60px 18px 40px;
color:#222;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:#fff;
border-radius:24px;
padding:38px;
margin-bottom:30px;
box-shadow:0 10px 30px rgba(76,32,155,.15);
}

.topline{
height:9px;
background:#6d3cc8;
margin:-38px -38px 32px;
border-radius:14px 14px 0 0;
}

h1{font-size:42px;margin-bottom:20px}
h2{font-size:30px;margin-bottom:18px;color:#5b33b2}

label{
display:block;
font-weight:bold;
margin-top:24px;
margin-bottom:10px;
}

input,textarea{
width:100%;
padding:16px;
border:1px solid #ddd;
border-radius:12px;
}

button{
background:#6d3cc8;
color:#fff;
border:none;
padding:18px 40px;
font-size:20px;
border-radius:14px;
margin-top:35px;
width:100%;
}

@media(max-width:768px){
h1{font-size:28px}
h2{font-size:24px}
}
</style>

<script>
async function searchAddress(){

let zip=
document.getElementById("zipcode")
.value.replace("-","");

if(zip.length!==7) return;

const res=
await fetch(
"https://zipcloud.ibsnet.co.jp/api/search?zipcode="+zip
);

const data=await res.json();

if(data.results){

pref.value=
data.results[0].address1;

city.value=
data.results[0].address2+
data.results[0].address3;

}

}
</script>

</head>
<body>

<div class="container">

<form id="myForm">

<div class="card">

<div class="topline"></div>

<h1>本人確認フォーム</h1>

<p>
※入力内容に不備がある場合は審査が遅れる場合があります。<br>
※追加書類をご案内する場合があります。
</p>

</div>


<div class="card">

<h2>賃貸条件</h2>

<label>入居希望日</label>
<input id="movein" type="date">

<label>駐車場</label>
<input id="parking">

<label>駐輪場</label>
<input id="cycle">

<label>バイク置き場</label>
<input id="bike">

<label>ペット</label>
<input id="pet">

</div>


<div class="card">

<h2>現住所</h2>

<label>郵便番号</label>
<input
id="zipcode"
onkeyup="searchAddress()"
>

<label>都道府県</label>
<input id="pref">

<label>市区町村</label>
<input id="city">

<label>番地</label>
<input id="address">

<label>建物・部屋番号</label>
<input id="room">

</div>



<div class="card">

<h2>勤務先情報</h2>

<label>勤務先名</label>
<input id="company">

<label>所属部署</label>
<input id="department">

</div>



<div class="card">

<h2>緊急連絡先</h2>

<label>氏名</label>
<input id="emergency_name">

<label>フリガナ</label>
<input id="emergency_kana">

<label>続柄</label>
<input id="emergency_relation">

<label>電話番号</label>
<input id="emergency_tel">

<label>住所</label>
<input id="emergency_address">

</div>



<div class="card">

<h2>本人確認書類提出</h2>

<label>本人確認書類アップロード</label>
<input type="file" id="file">

<button type="submit">
送信する
</button>

<div id="msg"></div>

</div>

</form>

</div>


<script>

document.getElementById(
"myForm"
).addEventListener(
"submit",
async function(e){

e.preventDefault();

msg.innerHTML="送信中...";

let fileInput=file.files[0];

let base64="";

if(fileInput){

base64=
await new Promise(resolve=>{

let reader=
new FileReader();

reader.onload=function(){

resolve(
reader.result
.split(",")[1]
);

};

reader.readAsDataURL(
fileInput
);

});

}

const payload={

movein:movein.value,
parking:parking.value,
cycle:cycle.value,
bike:bike.value,
pet:pet.value,

zipcode:zipcode.value,
pref:pref.value,
city:city.value,
address:address.value,
room:room.value,

company:company.value,
department:department.value,

emergency_name:
emergency_name.value,

emergency_kana:
emergency_kana.value,

emergency_relation:
emergency_relation.value,

emergency_tel:
emergency_tel.value,

emergency_address:
emergency_address.value,

file:base64,
fileName:fileInput?.name,
fileType:fileInput?.type

};

await fetch(
"https://script.google.com/macros/s/AKfycbwh5u1LSDMJccA1FNo6T7AvTBADOeGyPpCmn6H69XMSC1xhe7XgQ7OeomhkXh1WNoI/exec",
{
method:"POST",
body:JSON.stringify(payload)
}
);

msg.innerHTML=
"送信完了しました";

myForm.reset();

}
);

</script>

</body>
</html>
