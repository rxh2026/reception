<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本人確認フォーム</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Yu Gothic",sans-serif;
background:#ede7f6;
padding:40px 20px;
color:#222;
}

.wrap{
max-width:960px;
margin:auto;
}

.card{
background:#fff;
border-radius:14px;
padding:38px;
margin-bottom:26px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.topline{
height:10px;
background:#673ab7;
border-radius:14px 14px 0 0;
margin:-38px -38px 30px;
}

h1{
font-size:56px;
font-weight:400;
margin-bottom:25px;
}

h2{
font-size:24px;
margin-bottom:18px;
}

p{
line-height:1.8;
font-size:18px;
}

label{
display:block;
margin-top:24px;
margin-bottom:10px;
font-size:18px;
font-weight:600;
}

input[type=text],
input[type=email],
input[type=tel],
input[type=date],
select,
textarea{
width:100%;
border:none;
border-bottom:2px solid #ddd;
padding:15px 5px;
font-size:18px;
background:transparent;
}

textarea{
min-height:100px;
}

.radio{
margin-top:14px;
}

.radio label{
font-weight:400;
margin:16px 0;
}

input[type=radio],
input[type=checkbox]{
width:auto;
margin-right:10px;
transform:scale(1.2);
}

.filebox{
border:2px dashed #ccc;
padding:25px;
border-radius:10px;
margin-top:18px;
}

button{
background:#673ab7;
color:#fff;
border:none;
padding:18px 44px;
font-size:22px;
border-radius:10px;
margin-top:30px;
cursor:pointer;
}

button:hover{
opacity:.92;
}

.note{
font-size:14px;
margin-top:12px;
color:#666;
}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<div class="topline"></div>

<h1>申し込みフォーム（個人）</h1>

<p>
以下の内容をご入力ください。内容確認後、担当者よりご連絡いたします。<br>
入力内容に不備がある場合は審査が遅れる場合があります。<br>
追加書類をご案内する場合があります。
</p>

</div>

<form>

<div class="card">
<h2>個人情報の取り扱い</h2>
<p>ご入力いただいた個人情報は、審査・連絡目的のみに使用します。</p>

<div class="radio">
<label>
<input type="checkbox">
同意する
</label>
</div>
</div>

<div class="card">
<h2>賃貸条件に関して</h2>

<label>入居希望日</label>
<input type="date">

<label>駐車場</label>
<div class="radio">
<label><input type="radio" name="p">希望する</label>
<label><input type="radio" name="p">希望しない</label>
</div>

<label>バイク置き場</label>
<div class="radio">
<label><input type="radio" name="b">希望する</label>
<label><input type="radio" name="b">希望しない</label>
</div>

<label>ペット飼育</label>
<div class="radio">
<label><input type="radio" name="pet">あり</label>
<label><input type="radio" name="pet">なし</label>
</div>

</div>

<div class="card">
<h2>契約者様情報</h2>

<label>氏名（姓）</label>
<input type="text">

<label>氏名（名）</label>
<input type="text">

<label>フリガナ（姓）</label>
<input type="text">

<label>フリガナ（名）</label>
<input type="text">

<label>性別</label>
<select>
<option>男性</option>
<option>女性</option>
</select>

<label>生年月日</label>
<input type="date">

<label>電話番号</label>
<input type="tel">

<label>メールアドレス</label>
<input type="email">

<label>配偶者</label>
<select>
<option>あり</option>
<option>なし</option>
</select>

<label>家族構成</label>
<input type="text">

</div>

<div class="card">
<h2>現住所</h2>

<label>郵便番号</label>
<input type="text">

<label>都道府県</label>
<input type="text">

<label>市区町村</label>
<input type="text">

<label>番地</label>
<input type="text">

<label>建物・部屋番号</label>
<input type="text">

<label>現住居形態</label>
<select>
<option>賃貸</option>
<option>持家</option>
<option>社宅</option>
<option>実家</option>
</select>

<label>現在の家賃</label>
<input type="text">

<label>居住年数</label>
<input type="text">

<label>転居理由</label>
<textarea></textarea>

</div>

<div class="card">
<h2>勤務先情報</h2>

<label>勤務先名</label>
<input type="text">

<label>勤務先住所</label>
<input type="text">

<label>電話番号</label>
<input type="text">

<label>年収</label>
<input type="text">

<label>勤続年数</label>
<input type="text">

<label>業種</label>
<input type="text">

</div>

<div class="card">
<h2>緊急連絡先</h2>

<label>氏名</label>
<input type="text">

<label>続柄</label>
<input type="text">

<label>電話番号</label>
<input type="text">

<label>住所</label>
<input type="text">

</div>

<div class="card">
<h2>本人確認書類提出</h2>

<div class="filebox">
<input type="file">
<div class="note">
運転免許証・マイナンバー（表面）・パスポート等
</div>
</div>

<button type="submit">
送信する
</button>

</div>

</form>

</div>

</body>
</html>
