<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式会社RH</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg,#1c1c2e,#2a2f4f,#3b3f6b);
}

/* レイアウト */
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* カード */
.card {
  background: #f7f7f7;
  width: 90%;
  max-width: 400px;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

/* ロゴ */
.logo {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 20px;
}

/* メニュー */
.menu {
  display: block;
  margin-top: 15px;
  padding: 14px;
  background: #fff;
  border-radius: 10px;
  text-decoration: none;
  color: #000;
  transition: 0.3s;
}

/* ホバー */
.menu:hover {
  transform: translateY(-3px);
}

/* タップ */
.menu:active {
  transform: scale(0.97);
}

/* フェードイン */
.fade {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
}

/* 順番に出る */
.menu:nth-of-type(1) { animation-delay: 0.1s; }
.menu:nth-of-type(2) { animation-delay: 0.2s; }
.menu:nth-of-type(3) { animation-delay: 0.3s; }
.menu:nth-of-type(4) { animation-delay: 0.4s; }

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="logo fade">株式会社RH</div>

    <a href="flow.html" class="menu fade">🏠 申込から入居までの流れ</a>
    <a href="guarantee.html" class="menu fade">💳 保証会社とは</a>
    <a href="system.html" class="menu fade">📊 物件情報流通の仕組み</a>
    <a href="listing.html" class="menu fade">🌐 掲載までの流れ</a>

  </div>
</div>

</body>
</html>
