<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式会社RH</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f0f10;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  text-align: center;
}

/* ロゴ風タイトル */
.title {
  font-size: 36px;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

.sub {
  font-size: 14px;
  opacity: 0.6;
  margin-bottom: 40px;
}

/* セレクトボックス */
select {
  padding: 14px 20px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  width: 260px;
  background: #1c1c1f;
  color: #fff;
  text-align: center;
}

/* スマホ */
@media(max-width:600px){
  .title {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<div>
  <div class="title">株式会社RH</div>
  <div class="sub">Real Estate Solution</div>

  <select onchange="movePage(this)">
    <option value="">コンテンツを選択</option>
    <option value="flow.html">申込から入居までの流れ</option>
    <option value="guarantee.html">保証会社とは</option>
    <option value="system.html">物件情報流通の仕組み</option>
    <option value="listing.html">物件情報が掲載されるまで</option>
  </select>
</div>

<script>
function movePage(select){
  if(select.value){
    window.location.href = select.value;
  }
}
</script>

</body>
</html>
