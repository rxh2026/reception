<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>引越しチェックリスト｜株式会社RH</title>

<style>
:root {
  --navy: #10244a;
  --navy-dark: #07152f;
  --gold: #c78b19;
  --gold-light: #e1b85d;
  --text: #2c2c2c;
  --sub-text: #6d6d6d;
  --border: #e2e5eb;
  --card-bg: #ffffff;
  --section-bg: #f5f6f8;
  --done-bg: #f0f6f2;
  --done-border: #b8d3c0;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 16px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    sans-serif;

  color: var(--text);

  background:
    radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 35%),
    linear-gradient(145deg, #111827 0%, #17264b 48%, #090f1d 100%);
}

.container {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;

  background: var(--card-bg);
  border-radius: 22px;
  overflow: hidden;

  box-shadow:
    0 24px 60px rgba(0,0,0,0.32),
    0 2px 8px rgba(0,0,0,0.12);
}

.header {
  position: relative;
  padding: 28px 24px 25px;
  text-align: center;

  background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
  border-bottom: 1px solid #eceef2;
}

.header::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;

  width: 72px;
  height: 3px;

  transform: translateX(-50%);
  border-radius: 99px;

  background: linear-gradient(90deg, var(--gold), var(--gold-light));
}

.company-logo {
  margin: 0 auto 23px;
}

.company-logo img {
  display: block;
  width: 100%;
  max-width: 410px;
  height: auto;
  margin: 0 auto;
}

.page-title {
  margin: 0;
  color: var(--navy);

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Times New Roman",
    serif;

  font-size: 25px;
  font-weight: 700;
  letter-spacing: 0.07em;
}

.page-description {
  margin: 13px 0 0;
  color: var(--sub-text);
  font-size: 13px;
  line-height: 1.9;
}

.content {
  padding: 24px;
}

.progress-box {
  margin-bottom: 22px;
  padding: 17px 18px;

  border: 1px solid #e8eaf0;
  border-radius: 14px;
  background: var(--section-bg);
}

.progress-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.progress-label {
  color: var(--navy);
  font-size: 13px;
  font-weight: 700;
}

.progress-count {
  color: var(--gold);
  font-size: 13px;
  font-weight: 700;
}

.progress-bar {
  width: 100%;
  height: 10px;
  overflow: hidden;

  border-radius: 99px;
  background: #e2e5ea;
}

.progress-fill {
  width: 0%;
  height: 100%;

  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));

  transition: width 0.25s ease;
}

.section {
  margin-bottom: 18px;
  padding: 20px 18px;

  border: 1px solid #e8eaf0;
  border-radius: 16px;
  background: var(--section-bg);
}

.section-title {
  display: flex;
  align-items: center;
  gap: 11px;

  margin: 0 0 16px;

  color: var(--navy);
  font-size: 17px;
  font-weight: 700;
}

.section-icon {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 42px;
  height: 42px;
  flex-shrink: 0;

  border-radius: 12px;

  background: linear-gradient(145deg, #f4ead4, #fffaf0);
  font-size: 22px;
}

.check-list {
  display: grid;
  gap: 10px;
}

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 11px;

  padding: 13px 14px;

  border: 1px solid var(--border);
  border-radius: 11px;
  background: #ffffff;

  cursor: pointer;

  transition:
    background 0.2s,
    border-color 0.2s,
    transform 0.2s;
}

.check-item:hover {
  transform: translateY(-1px);
  border-color: #c9a558;
}

.check-item.done {
  border-color: var(--done-border);
  background: var(--done-bg);
}

.check-item input {
  width: 20px;
  height: 20px;
  margin: 2px 0 0;
  flex-shrink: 0;

  accent-color: var(--navy);
  cursor: pointer;
}

.check-text {
  color: #40454e;
  font-size: 13px;
  line-height: 1.75;
}

.check-item.done .check-text {
  color: #718078;
  text-decoration: line-through;
}

.check-text strong {
  color: var(--navy);
}

.note {
  display: block;
  margin-top: 4px;

  color: #80858d;
  font-size: 11px;
  line-height: 1.6;
}

.action-area {
  display: flex;
  justify-content: center;
  margin-top: 22px;
}

.reset-button {
  min-height: 45px;
  padding: 0 18px;

  border: 1px solid #c8ccd2;
  border-radius: 11px;

  color: #6a7079;
  background: #ffffff;

  font-family: inherit;
  font-size: 12px;
  font-weight: 700;

  cursor: pointer;
}

.reset-button:hover {
  border-color: var(--navy);
  color: var(--navy);
}

.save-note {
  margin: 13px 0 0;

  color: #858a93;
  text-align: center;
  font-size: 10.5px;
  line-height: 1.7;
}

.back-area {
  margin-top: 24px;
  text-align: center;
}

.back-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-height: 48px;
  padding: 0 22px;

  border: 1px solid var(--navy);
  border-radius: 12px;

  color: var(--navy);
  background: #ffffff;

  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
}

.back-button:hover {
  color: #ffffff;
  background: var(--navy);
}

.footer-message {
  margin-top: 24px;
  padding-top: 20px;

  border-top: 1px solid #eceef2;

  color: #888d96;
  text-align: center;
  font-size: 11px;
  line-height: 1.9;
}

.brand-message {
  margin: 10px 0 0;

  color: var(--navy);
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size: 12px;
  font-weight: 600;
}

@media (max-width: 520px) {
  body {
    padding: 12px 9px 22px;
  }

  .container {
    border-radius: 16px;
  }

  .header {
    padding: 24px 16px 22px;
  }

  .company-logo img {
    max-width: 360px;
  }

  .page-title {
    font-size: 22px;
  }

  .page-description {
    font-size: 12px;
  }

  .content {
    padding: 18px 14px 22px;
  }

  .section {
    padding: 17px 14px;
    border-radius: 13px;
  }

  .section-title {
    font-size: 15px;
  }

  .check-text {
    font-size: 12.5px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">

    <div class="company-logo">
      <img src="./logo.png" alt="株式会社RH Rich Happiness">
    </div>

    <h1 class="page-title">引越しチェックリスト</h1>

    <p class="page-description">
      お引越し前からご入居後までに必要な手続きを<br>
      順番に確認できます。
    </p>

  </header>

  <main class="content">

    <div class="progress-box">

      <div class="progress-top">
        <span class="progress-label">進捗状況</span>
        <span class="progress-count" id="progressCount">0 / 0 完了</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

    </div>

    <section class="section">

      <h2 class="section-title">
        <span class="section-icon">📅</span>
        引越しが決まったら
      </h2>

      <div class="check-list">

        <label class="check-item">
          <input type="checkbox" data-id="moving-company">
          <span class="check-text">
            <strong>引越し業者の見積もり・予約</strong>
            <span class="note">
              必要に応じて、株式会社RHの提携業者をご案内・手配することも可能です。
            </span>
          </span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="current-cancel">
          <span class="check-text">
            <strong>現在の住まいの解約手続き</strong>
            <span class="note">
              新居の入居審査が承認される前に解約手続きをすると、
              審査結果によっては住まいが確保できない期間が生じる可能性があります。
              原則として、審査承認後に退去予告を出すと安心です。
            </span>
          </span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="lifeline">
          <span class="check-text">
            <strong>電気・ガス・水道の使用開始手続き</strong>
            <span class="note">
              電気・ガス・水道の開始手続きが必要です。
              ガスは開栓時に立会いが必要となる場合があります。
              必要に応じて、株式会社RHの提携業者からご案内・手配することも可能です。
            </span>
          </span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="internet">
          <span class="check-text">
            <strong>インターネットの申込み・移転手続き</strong>
            <span class="note">
              工事が必要な場合は、開通まで時間がかかることがあります。
              ライフラインとあわせて、株式会社RHの提携業者からご案内することも可能です。
            </span>
          </span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="mail-forward">
          <span class="check-text"><strong>郵便物の転送届</strong></span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="packing">
          <span class="check-text"><strong>荷造り・不用品の処分</strong></span>
        </label>

      </div>

    </section>

    <section class="section">

      <h2 class="section-title">
        <span class="section-icon">🔑</span>
        鍵のお渡し・ご入居
      </h2>

      <div class="check-list">

        <label class="check-item">
          <input type="checkbox" data-id="keys">
          <span class="check-text">
            <strong>新居の鍵を受け取る</strong>
            <span class="note">
              多くの物件では、契約開始日（家賃発生日・入居可能日）の前日14時頃から
              鍵をお渡しできる場合があります。
              ただし、物件や管理会社によって異なりますので、事前に担当者へご確認ください。
            </span>
          </span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="room-photo">
          <span class="check-text">
            <strong>室内の傷・汚れを確認し、写真を撮影する</strong>
            <span class="note">
              入居時の室内写真を日付が分かる状態で保存しておくと安心です。
              また、管理会社指定の「入居時チェックリスト」や
              「室内状況確認書」を提出するケースが多いため、
              提出期限もあわせてご確認ください。
            </span>
          </span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="equipment">
          <span class="check-text">
            <strong>設備・水回り・電気の動作確認</strong>
          </span>
        </label>

      </div>

    </section>

    <section class="section">

      <h2 class="section-title">
        <span class="section-icon">🏠</span>
        引越し後
      </h2>

      <div class="check-list">

        <label class="check-item">
          <input type="checkbox" data-id="resident-move">
          <span class="check-text">
            <strong>転出届・転入届・転居届</strong>
            <span class="note">手続き期限をご確認ください。</span>
          </span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="my-number">
          <span class="check-text"><strong>マイナンバーカードの住所変更</strong></span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="license">
          <span class="check-text"><strong>運転免許証の住所変更</strong></span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="bank-card">
          <span class="check-text"><strong>銀行・クレジットカードの住所変更</strong></span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="insurance">
          <span class="check-text"><strong>保険・勤務先・学校などの住所変更</strong></span>
        </label>

        <label class="check-item">
          <input type="checkbox" data-id="shopping">
          <span class="check-text"><strong>通販サイト・各種サービスの配送先変更</strong></span>
        </label>

      </div>

    </section>

    <div class="action-area">
      <button class="reset-button" id="resetButton" type="button">
        チェックをすべてリセット
      </button>
    </div>

    <p class="save-note">
      チェック状況は、この端末のブラウザ内に自動保存されます。
    </p>

    <div class="back-area">
      <a href="index2.html" class="back-button">← お役立ち情報へ戻る</a>
    </div>

    <footer class="footer-message">

      <p>
        お引越しやライフラインのお手続きについてご不明な点がございましたら、<br>
        担当スタッフまでお気軽にご確認ください。
      </p>

      <p class="brand-message">
        Rich Happiness ― 豊かで幸せな暮らしのお手伝い
      </p>

    </footer>

  </main>

</div>

<script>
const storageKey = "rh-moving-checklist-v2";
const checkboxes = Array.from(
  document.querySelectorAll('input[type="checkbox"][data-id]')
);
const progressCount = document.getElementById("progressCount");
const progressFill = document.getElementById("progressFill");
const resetButton = document.getElementById("resetButton");

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");

    checkboxes.forEach(function (checkbox) {
      checkbox.checked = Boolean(saved[checkbox.dataset.id]);
      updateItemStyle(checkbox);
    });
  } catch (error) {
    console.error(error);
  }

  updateProgress();
}

function saveState() {
  const state = {};

  checkboxes.forEach(function (checkbox) {
    state[checkbox.dataset.id] = checkbox.checked;
  });

  localStorage.setItem(storageKey, JSON.stringify(state));
}

function updateItemStyle(checkbox) {
  const item = checkbox.closest(".check-item");

  if (item) {
    item.classList.toggle("done", checkbox.checked);
  }
}

function updateProgress() {
  const completed = checkboxes.filter(function (checkbox) {
    return checkbox.checked;
  }).length;

  const total = checkboxes.length;
  const percentage = total === 0 ? 0 : (completed / total) * 100;

  progressCount.textContent = completed + " / " + total + " 完了";
  progressFill.style.width = percentage + "%";
}

checkboxes.forEach(function (checkbox) {
  checkbox.addEventListener("change", function () {
    updateItemStyle(checkbox);
    updateProgress();
    saveState();
  });
});

resetButton.addEventListener("click", function () {
  const confirmed = window.confirm(
    "すべてのチェックを外してもよろしいですか？"
  );

  if (!confirmed) {
    return;
  }

  checkboxes.forEach(function (checkbox) {
    checkbox.checked = false;
    updateItemStyle(checkbox);
  });

  localStorage.removeItem(storageKey);
  updateProgress();
});

loadState();
</script>

</body>
</html>
