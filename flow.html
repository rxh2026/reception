<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申込から入居までの流れ | 株式会社RH</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg,#1c1c2e,#2a2f4f,#3b3f6b);
}

.container {
  display: flex;
  justify-content: center;
  padding: 30px 0;
}

.card {
  background: #f7f7f7;
  width: 90%;
  max-width: 420px;
  padding: 25px;
  border-radius: 20px;
}

.back {
  text-decoration: none;
  color: #555;
}

.title {
  text-align: center;
  margin: 10px 0 20px;
  font-size: 18px;
  font-weight: bold;
}

/* ボックス */
.box {
  background: #fff;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 10px;
  transition: 0.3s;
}

.box:hover { transform: translateY(-3px); }
.box:active { transform: scale(0.97); }

/* アニメーション */
.fade {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
}

.box:nth-of-type(1){animation-delay:0.1s;}
.box:nth-of-type(2){animation-delay:0.2s;}
.box:nth-of-type(3){animation-delay:0.3s;}
.box:nth-of-type(4){animation-delay:0.4s;}
.box:nth-of-type(5){animation-delay:0.5s;}
.box:nth-of-type(6){animation-delay:0.6s;}

@keyframes fadeUp {
  to { opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>
<div class="container">
<div class="card">

<a href="index2.html" class="back">← 戻る</a>

<div class="title fade">🏠 申込から入居までの流れ</div>

<div class="box fade"><h3>② 物件紹介</h3><p>条件に合う物件をご提案</p></div>
<div class="box fade"><h3>③ 内見・申込</h3><p>気に入った物件に申込</p></div>
<div class="box fade"><h3>④ 審査</h3><p>保証会社の審査あり</p></div>
<div class="box fade"><h3>⑤ 契約・入金</h3><p>契約と初期費用支払い</p></div>
<div class="box fade"><h3>⑥ 入居</h3><p>鍵渡し後スタート</p></div>

</div>
</div>
</body>
</html>
