<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お客様受付フォーム（詳細）｜株式会社RH</title>

<style>
:root {
  --navy: #10244a;
  --navy-dark: #07152f;
  --gold: #c78b19;
  --gold-light: #e1b85d;
  --text: #2c2c2c;
  --sub-text: #6d6d6d;
  --border: #dfe3e9;
  --background: #f4f5f8;
  --card: #ffffff;
  --input-bg: #fbfbfc;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 16px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    sans-serif;

  color: var(--text);

  background:
    radial-gradient(
      circle at top,
      rgba(255,255,255,0.12),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #111827 0%,
      #17264b 48%,
      #090f1d 100%
    );
}

.form-container,
.thank-you-container {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;

  background: var(--card);
  border-radius: 22px;
  overflow: hidden;

  box-shadow:
    0 24px 60px rgba(0,0,0,0.32),
    0 2px 8px rgba(0,0,0,0.12);
}

.form-header {
  padding: 28px 24px 24px;
  text-align: center;
  position: relative;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #fafafa 100%
    );

  border-bottom: 1px solid #eceef2;
}

.form-header::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;

  width: 72px;
  height: 3px;

  transform: translateX(-50%);
  border-radius: 99px;

  background:
    linear-gradient(
      90deg,
      var(--gold),
      var(--gold-light)
    );
}

.company-logo {
  margin: 0 auto 24px;
}

.company-logo img {
  display: block;
  width: 100%;
  max-width: 410px;
  height: auto;
  margin: 0 auto;
}

.form-title {
  margin: 0;
  color: var(--navy);

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Times New Roman",
    serif;

  font-size: 25px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.form-subtitle {
  margin: 12px 0 0;
  color: var(--sub-text);
  font-size: 13px;
  line-height: 1.9;
}

.form-body {
  padding: 24px;
}

.form-section {
  margin-bottom: 22px;
  padding: 20px 18px;

  background: var(--background);
  border: 1px solid #e8eaf0;
  border-radius: 16px;
}

.form-section:last-of-type {
  margin-bottom: 0;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;

  margin: 0 0 18px;

  color: var(--navy);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.section-title::before {
  content: "";
  display: block;

  width: 5px;
  height: 22px;
  border-radius: 99px;

  background:
    linear-gradient(
      180deg,
      var(--gold-light),
      var(--gold)
    );
}

.field {
  margin-top: 18px;
}

.field:first-of-type {
  margin-top: 0;
}

.field-label {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;

  margin-bottom: 7px;

  color: #3f4652;
  font-size: 14px;
  font-weight: 700;
}

.required-badge,
.optional-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
}

.required-badge {
  color: #ffffff;
  background: var(--navy);
}

.optional-badge {
  color: #6a6f78;
  background: #e7e9ed;
}

input[type="text"],
input[type="number"],
input[type="tel"],
input[type="email"],
select,
textarea {
  width: 100%;
  min-height: 52px;

  padding: 13px 14px;

  border: 1px solid var(--border);
  border-radius: 11px;

  color: #222222;
  background: var(--input-bg);

  font-size: 16px;
  font-family: inherit;

  transition:
    border-color 0.2s,
    background 0.2s,
    box-shadow 0.2s;
}

textarea {
  min-height: 118px;
  resize: vertical;
}

input::placeholder,
textarea::placeholder {
  color: #a2a6ad;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  background: #ffffff;
  border-color: var(--navy);

  box-shadow:
    0 0 0 4px rgba(16,36,74,0.09);
}

select {
  appearance: none;
  cursor: pointer;

  background-image:
    linear-gradient(45deg, transparent 50%, #747a84 50%),
    linear-gradient(135deg, #747a84 50%, transparent 50%);

  background-position:
    calc(100% - 19px) 22px,
    calc(100% - 14px) 22px;

  background-size:
    5px 5px,
    5px 5px;

  background-repeat: no-repeat;
  padding-right: 40px;
}

.field-note {
  margin: 7px 2px 0;
  color: #858a93;
  font-size: 11px;
  line-height: 1.6;
}

.checkbox-group {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 9px;
}

.checkbox-item {
  display: flex;
  align-items: center;
  gap: 9px;

  margin: 0;
  padding: 12px;

  border: 1px solid #dddddd;
  border-radius: 9px;
  background: #fafafa;

  color: #333333;
  font-size: 15px;
  font-weight: normal;
  cursor: pointer;
}

.checkbox-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--navy);
}

.submit-area {
  padding-top: 26px;
}

.submit-button {
  width: 100%;
  min-height: 58px;

  border: none;
  border-radius: 14px;

  color: #ffffff;

  background:
    linear-gradient(
      135deg,
      #1a3567 0%,
      #07142c 100%
    );

  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 0.08em;

  cursor: pointer;

  box-shadow:
    0 10px 24px rgba(7,20,44,0.25);

  transition:
    transform 0.2s,
    box-shadow 0.2s,
    opacity 0.2s;
}

.submit-button:hover {
  transform: translateY(-1px);

  box-shadow:
    0 14px 28px rgba(7,20,44,0.3);
}

.submit-button:active {
  transform: translateY(0);
}

.submit-button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.privacy-note {
  margin: 14px 0 0;
  color: #878c95;
  text-align: center;
  font-size: 11px;
  line-height: 1.7;
}

#thankYou {
  display: none;
}

.thank-you-container {
  padding: 38px 26px;
  text-align: center;
}

.thank-you-logo {
  margin-bottom: 28px;
}

.thank-you-logo img {
  display: block;
  width: 100%;
  max-width: 380px;
  height: auto;
  margin: 0 auto;
}

.thank-you-icon {
  display: flex;
  justify-content: center;
  align-items: center;

  width: 68px;
  height: 68px;

  margin: 0 auto 22px;
  border-radius: 50%;

  color: #ffffff;
  background:
    linear-gradient(
      135deg,
      var(--gold-light),
      var(--gold)
    );

  font-size: 34px;
  font-weight: bold;

  box-shadow:
    0 10px 25px rgba(199,139,25,0.25);
}

.thank-you-title {
  margin: 0 0 14px;
  color: var(--navy);

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    "Times New Roman",
    serif;

  font-size: 24px;
  letter-spacing: 0.05em;
}

.thank-you-text {
  margin: 0;
  color: var(--sub-text);
  font-size: 14px;
  line-height: 1.9;
}

.thank-you-divider {
  width: 64px;
  height: 2px;
  margin: 26px auto;
  border-radius: 99px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      transparent
    );
}

.company-message {
  margin: 0;
  color: #8b8f97;
  font-size: 11px;
  line-height: 1.8;
}

@media (max-width: 520px) {
  body {
    padding: 12px 9px 22px;
  }

  .form-container,
  .thank-you-container {
    border-radius: 16px;
  }

  .form-header {
    padding: 24px 16px 21px;
  }

  .company-logo img {
    max-width: 360px;
  }

  .form-title {
    font-size: 22px;
  }

  .form-subtitle {
    font-size: 12px;
  }

  .form-body {
    padding: 18px 14px 22px;
  }

  .form-section {
    padding: 18px 14px;
    border-radius: 13px;
  }

  .section-title {
    font-size: 15px;
  }

  .thank-you-container {
    padding: 32px 18px;
  }
}

@media (max-width: 380px) {
  .checkbox-group {
    grid-template-columns: 1fr;
  }

  .company-logo img {
    max-width: 320px;
  }

  .form-title {
    font-size: 20px;
  }

  .form-section {
    padding: 16px 12px;
  }
}
</style>
</head>

<body>

<div class="form-container" id="formArea">

  <header class="form-header">

    <div class="company-logo">
      <img
        src="./logo.png"
        alt="株式会社RH Rich Happiness"
      >
    </div>

    <h1 class="form-title">
      お客様受付フォーム
    </h1>

    <p class="form-subtitle">
      お部屋探しをよりスムーズに進めるため、<br>
      現在お決まりの範囲でご入力ください。
    </p>

  </header>

  <main class="form-body">

    <form id="myForm">

      <section class="form-section">

        <h2 class="section-title">
          お客様情報
        </h2>

        <div class="field">
          <label class="field-label" for="name">
            お名前（フリガナ）
            <span class="required-badge">必須</span>
          </label>

          <input
            id="name"
            type="text"
            name="name"
            placeholder="例：ヤマダ タロウ"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label class="field-label" for="age">
            年齢
            <span class="optional-badge">任意</span>
          </label>

          <input
            id="age"
            type="number"
            name="age"
            placeholder="例：30"
            min="0"
            max="120"
            inputmode="numeric"
          >
        </div>

        <div class="field">
          <label class="field-label" for="phone">
            電話番号
            <span class="required-badge">必須</span>
          </label>

          <input
            id="phone"
            type="tel"
            name="phone"
            placeholder="例：09012345678"
            autocomplete="tel"
            inputmode="tel"
            required
          >

          <p class="field-note">
            ハイフンあり・なし、どちらでも入力できます。
          </p>
        </div>

        <div class="field">
          <label class="field-label" for="email">
            メールアドレス
            <span class="optional-badge">任意</span>
          </label>

          <input
            id="email"
            type="email"
            name="email"
            placeholder="例：example@email.com"
            autocomplete="email"
            inputmode="email"
          >
        </div>

        <div class="field">
          <label class="field-label" for="address">
            住所
            <span class="optional-badge">任意</span>
          </label>

          <input
            id="address"
            type="text"
            name="address"
            placeholder="現在お住まいの住所"
            autocomplete="street-address"
          >
        </div>

      </section>

      <section class="form-section">

        <h2 class="section-title">
          ご勤務先・契約情報
        </h2>

        <div class="field">
          <label class="field-label" for="work">
            勤務先名・学校名
            <span class="optional-badge">任意</span>
          </label>

          <input
            id="work"
            type="text"
            name="work"
            placeholder="例：株式会社〇〇"
            autocomplete="organization"
          >
        </div>

        <div class="field">
          <label class="field-label" for="job">
            ご職業
            <span class="optional-badge">任意</span>
          </label>

          <select id="job" name="job">
            <option value="">選択してください</option>
            <option>会社員</option>
            <option>会社役員</option>
            <option>会社経営</option>
            <option>自営業</option>
            <option>公務員</option>
            <option>契約社員</option>
            <option>派遣社員</option>
            <option>学生</option>
            <option>アルバイト</option>
            <option>その他</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="contract">
            契約名義
            <span class="required-badge">必須</span>
          </label>

          <select id="contract" name="contract" required>
            <option value="">選択してください</option>
            <option>個人</option>
            <option>法人（総務の方）</option>
            <option>法人（社宅代行）</option>
            <option>未定</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="realestate">
            不動産の購入や売却を検討されていますか
            <span class="optional-badge">任意</span>
          </label>

          <select id="realestate" name="realestate">
            <option value="">選択してください</option>
            <option>検討している</option>
            <option>検討していない</option>
            <option>将来的に検討するかも</option>
          </select>
        </div>

      </section>

      <section class="form-section">

        <h2 class="section-title">
          お引越しのご予定
        </h2>

        <div class="field">
          <label class="field-label" for="reason">
            引越理由
            <span class="optional-badge">任意</span>
          </label>

          <input
            id="reason"
            type="text"
            name="reason"
            placeholder="例：転勤・更新・結婚・住み替え"
          >
        </div>

        <div class="field">
          <label class="field-label" for="timing">
            引越時期
            <span class="optional-badge">任意</span>
          </label>

          <select id="timing" name="timing">
            <option value="">選択してください</option>
            <option>すぐ</option>
            <option>1ヶ月以内</option>
            <option>3ヶ月以内</option>
            <option>半年以内</option>
            <option>いい物があれば</option>
          </select>
        </div>

      </section>

      <section class="form-section">

        <h2 class="section-title">
          ご希望条件
        </h2>

        <div class="field">
          <label class="field-label" for="rent">
            希望家賃
            <span class="optional-badge">任意</span>
          </label>

          <input
            id="rent"
            type="text"
            name="rent"
            placeholder="例：10万円"
          >
        </div>

        <div class="field">
          <div class="field-label">
            希望間取り
            <span class="optional-badge">複数選択可</span>
          </div>

          <div class="checkbox-group">

            <label class="checkbox-item">
              <input type="checkbox" name="layout" value="1R">
              <span>1R</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" name="layout" value="1K">
              <span>1K</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" name="layout" value="1DK">
              <span>1DK</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" name="layout" value="1LDK">
              <span>1LDK</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" name="layout" value="2DK">
              <span>2DK</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" name="layout" value="2LDK">
              <span>2LDK</span>
            </label>

            <label class="checkbox-item">
              <input type="checkbox" name="layout" value="3LDK以上">
              <span>3LDK以上</span>
            </label>

          </div>
        </div>

        <div class="field">
          <label class="field-label" for="size">
            希望の広さ
            <span class="optional-badge">任意</span>
          </label>

          <input
            id="size"
            type="text"
            name="size"
            placeholder="例：30㎡以上"
          >
        </div>

        <div class="field">
          <label class="field-label" for="buildingage">
            築年数
            <span class="optional-badge">任意</span>
          </label>

          <select id="buildingage" name="buildingage">
            <option value="">選択してください</option>
            <option>新築</option>
            <option>5年以内</option>
            <option>10年以内</option>
            <option>15年以内</option>
            <option>20年以内</option>
            <option>こだわらない</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="area">
            希望エリア
            <span class="optional-badge">任意</span>
          </label>

          <input
            id="area"
            type="text"
            name="area"
            placeholder="例：上野・湯島・御徒町周辺"
          >
        </div>

        <div class="field">
          <label class="field-label" for="station">
            駅から徒歩
            <span class="optional-badge">任意</span>
          </label>

          <select id="station" name="station">
            <option value="">選択してください</option>
            <option>5分以内</option>
            <option>10分以内</option>
            <option>15分以内</option>
            <option>こだわらない</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="floor">
            階数
            <span class="optional-badge">任意</span>
          </label>

          <select id="floor" name="floor">
            <option value="">選択してください</option>
            <option>1階OK</option>
            <option>2階以上</option>
            <option>こだわらない</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="sun">
            日当たり
            <span class="optional-badge">任意</span>
          </label>

          <select id="sun" name="sun">
            <option value="">選択してください</option>
            <option>良い方がいい</option>
            <option>普通でOK</option>
            <option>こだわらない</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="noise">
            音（防音・静かさ）
            <span class="optional-badge">任意</span>
          </label>

          <select id="noise" name="noise">
            <option value="">選択してください</option>
            <option>静かな環境がいい</option>
            <option>ある程度はOK</option>
            <option>気にしない</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="parking">
            駐車場
            <span class="optional-badge">任意</span>
          </label>

          <select id="parking" name="parking">
            <option value="">選択してください</option>
            <option>必要</option>
            <option>不要</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="net">
            インターネット環境
            <span class="optional-badge">任意</span>
          </label>

          <select id="net" name="net">
            <option value="">選択してください</option>
            <option>無料がいい</option>
            <option>あればOK</option>
            <option>こだわらない</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="request">
            その他ご要望
            <span class="optional-badge">任意</span>
          </label>

          <textarea
            id="request"
            name="request"
            rows="4"
            placeholder="ご希望や気になる点をご記入ください"
          ></textarea>
        </div>

      </section>

      <div class="submit-area">

        <button
          id="submitButton"
          class="submit-button"
          type="submit"
        >
          入力内容を送信する
        </button>

        <p class="privacy-note">
          ご入力いただいた情報は、お部屋探しや各種ご案内のために利用いたします。
        </p>

      </div>

    </form>

  </main>

</div>

<div id="thankYou">

  <div class="thank-you-container">

    <div class="thank-you-logo">
      <img
        src="./logo.png"
        alt="株式会社RH Rich Happiness"
      >
    </div>

    <div class="thank-you-icon">
      ✓
    </div>

    <h2 class="thank-you-title">
      送信ありがとうございました
    </h2>

    <p class="thank-you-text">
      ご入力いただいた内容を確認し、<br>
      担当者よりご案内いたします。
    </p>

    <div class="thank-you-divider"></div>

    <p class="company-message">
      RHは「Rich Happiness」の想いを込め、<br>
      住まいを通して豊かで幸せな暮らしをお手伝いいたします。
    </p>

  </div>

</div>

<script>
const form = document.getElementById("myForm");
const submitButton = document.getElementById("submitButton");
const formArea = document.getElementById("formArea");
const thankYou = document.getElementById("thankYou");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  submitButton.disabled = true;
  submitButton.textContent = "送信中です…";

  const data = new FormData(form);

  try {
    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbxooGYEGWQ2-Mj1bi-U7AN_S7xwoLqu7YRg79OddV9XEzz1sISf0RQVyL1C6UZC70P-/exec",
      {
        method: "POST",
        body: data
      }
    );

    const text = await response.text();

    if (
      response.ok &&
      (
        text.includes("OK") ||
        text.trim() === ""
      )
    ) {
      formArea.style.display = "none";
      thankYou.style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } else {
      throw new Error(
        text || "送信処理でエラーが発生しました"
      );
    }

  } catch (error) {
    alert(
      "送信に失敗しました。\n" +
      "時間をおいて再度お試しいただくか、担当者へご連絡ください。"
    );

    submitButton.disabled = false;
    submitButton.textContent = "入力内容を送信する";

    console.error(error);
  }
});
</script>
