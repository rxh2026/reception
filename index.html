<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>お客様入力フォーム</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: "Helvetica Neue", sans-serif;
  background: linear-gradient(135deg, #1e1e1e, #2c2c54, #3a3a3a);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  margin: 0;
}

.form-container {
  background: #ffffff;
  padding: 25px;
  border-radius: 16px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

h2 {
  text-align: center;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 18px;
  font-size: 14px;
  color: #555;
}

input, select {
  width: 100%;
  padding: 14px;
  margin-top: 6px;
  border-radius: 10px;
  border: 1px solid #ddd;
  background: #f9f9f9;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 30px;
  padding: 16px;
  background: linear-gradient(135deg, #2c2c54, #000);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
}

#thankYou {
  display: none;
  text-align: center;
  color: white;
}

/* ロゴ */
.company-name {
  text-align: center;
  margin-bottom: 25px;
}

.company-name .sub {
  font-size: 12px;
  color: #888;
}

.company-name .logo {
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 6px;
  font-family: serif;
}
</style>
</head>

<body>

<div class="form-container" id="formArea">

  <div class="company-name">
    <div class="sub">株式会社</div>
    <div class="logo">RH</div>
  </div>

  <h2>お客様入力フォーム</h2>

  <form id="myForm">

    <label>お名前（フリガナ）</label>
    <input type="text" name="name" required>

    <label>年齢</label>
    <input type="number" name="age">

    <label>電話番号</label>
    <input type="tel" name="phone" required>

    <label>メールアドレス</label>
    <input type="email" name="email">

    <label>住所</label>
    <input type="text" name="address">

    <label>勤務先名・学校名</label>
    <input type="text" name="work">

    <label>ご職業</label>
    <select name="job">
      <option value="">選択してください</option>
      <option>会社員</option>
      <option>会社役員</option>
      <option>会社経営</option>
      <option>自営業</option>
      <option>公務員</option>
      <option>契約社員</option>
      <option>派遣社員</option>
      <option>学生</option>
      <option>アルバイト</option>
      <option>その他</option>
    </select>

    <label>契約名義</label>
    <select name="contract" required>
      <option value="">選択してください</option>
      <option>個人</option>
      <option>法人（総務の方）</option>
      <option>法人（社宅代行）</option>
      <option>未定</option>
    </select>

    <label>不動産の購入や売却を検討されていますか（任意）</label>
    <select name="realestate">
      <option value="">選択してください</option>
      <option>検討している</option>
      <option>検討していない</option>
      <option>将来的に検討するかも</option>
    </select>

    <button type="submit">送信する</button>

  </form>
</div>

<div id="thankYou">
  <h2>送信ありがとうございました。</h2>
  <p>内容を確認させていただきます。</p>
</div>

<script>
const form = document.getElementById("myForm");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = new FormData(form);

  try {
    const res = await fetch("https://script.google.com/macros/s/AKfycbxooGYEGWQ2-Mj1bi-U7AN_S7xwoLqu7YRg79OddV9XEzz1sISf0RQVyL1C6UZC70P-/exec", {
      method: "POST",
      body: data
    });

    const text = await res.text();

    if (text.includes("OK")) {
      document.getElementById("formArea").style.display = "none";
      document.getElementById("thankYou").style.display = "block";
    } else {
      alert("送信エラー：" + text);
    }

  } catch (err) {
    alert("通信エラー：" + err);
  }
});
</script>

</body>
</html>
