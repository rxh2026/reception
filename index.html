<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お客様受付フォーム｜株式会社RH</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #151820,
      #20294b,
      #292c35
    );

  display: flex;
  justify-content: center;
  align-items: flex-start;

  min-height: 100vh;
  padding: 24px 16px;
  margin: 0;
}

/* フォーム本体 */
.form-container {
  background: #ffffff;
  width: 100%;
  max-width: 420px;
  padding: 28px 24px 32px;
  border-radius: 18px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
}

/* ロゴ */
.company-logo {
  text-align: center;
  margin: 0 auto 22px;
}

.company-logo img {
  display: block;
  width: 100%;
  max-width: 320px;
  height: auto;
  margin: 0 auto;
}

/* タイトル */
h2 {
  text-align: center;
  margin: 0 0 10px;
  color: #15254b;
  font-size: 23px;
  font-weight: 700;
  letter-spacing: 1px;
}

.introduction {
  margin: 0 0 28px;
  text-align: center;
  color: #666666;
  font-size: 13px;
  line-height: 1.8;
}

/* ラベル */
label {
  display: block;
  margin-top: 19px;
  color: #4d4d4d;
  font-size: 14px;
  font-weight: 600;
}

/* 入力欄 */
input[type="text"],
input[type="number"],
input[type="tel"],
input[type="email"],
select {
  width: 100%;
  margin-top: 7px;
  padding: 14px;
  border: 1px solid #d8d8d8;
  border-radius: 10px;
  background: #fafafa;
  color: #222222;
  font-size: 16px;
  transition: 0.2s;
}

input:focus,
select:focus {
  border-color: #21355f;
  background: #ffffff;
  outline: none;
  box-shadow: 0 0 0 3px rgba(33, 53, 95, 0.1);
}

/* 送信ボタン */
button {
  width: 100%;
  margin-top: 32px;
  padding: 16px;

  border: none;
  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #172951,
      #071226
    );

  color: #ffffff;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1px;

  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

/* 送信完了画面 */
#thankYou {
  display: none;
  width: 100%;
  max-width: 420px;
  padding: 40px 25px;

  border-radius: 18px;
  background: #ffffff;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
}

#thankYou h2 {
  margin-bottom: 14px;
  color: #15254b;
  font-size: 23px;
}

#thankYou p {
  color: #666666;
  line-height: 1.8;
}

/* スマホ用 */
@media (max-width: 480px) {
  body {
    padding: 14px 10px;
  }

  .form-container {
    padding: 24px 18px 28px;
    border-radius: 14px;
  }

  .company-logo img {
    max-width: 290px;
  }

  h2 {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<div class="form-container" id="formArea">

  <div class="company-logo">
    <img
      src="./logo.png"
      alt="株式会社RH Rich Happiness"
    >
  </div>

  <h2>お客様受付フォーム</h2>

  <p class="introduction">
    ご来店ありがとうございます。<br>
    よりスムーズなご案内のため、ご入力をお願いいたします。
  </p>

  <form id="myForm">

    <label for="name">お名前（フリガナ）</label>
    <input
      id="name"
      type="text"
      name="name"
      required
    >

    <label for="age">年齢</label>
    <input
      id="age"
      type="number"
      name="age"
      min="0"
    >

    <label for="phone">電話番号</label>
    <input
      id="phone"
      type="tel"
      name="phone"
      required
    >

    <label for="email">メールアドレス</label>
    <input
      id="email"
      type="email"
      name="email"
    >

    <label for="address">住所</label>
    <input
      id="address"
      type="text"
      name="address"
    >

    <label for="work">勤務先名・学校名</label>
    <input
      id="work"
      type="text"
      name="work"
    >

    <label for="job">ご職業</label>
    <select id="job" name="job">
      <option value="">選択してください</option>
      <option>会社員</option>
      <option>会社役員</option>
      <option>会社経営</option>
      <option>自営業</option>
      <option>公務員</option>
      <option>契約社員</option>
      <option>派遣社員</option>
      <option>学生</option>
      <option>アルバイト</option>
      <option>その他</option>
    </select>

    <label for="contract">契約名義</label>
    <select id="contract" name="contract" required>
      <option value="">選択してください</option>
      <option>個人</option>
      <option>法人（総務の方）</option>
      <option>法人（社宅代行）</option>
      <option>未定</option>
    </select>

    <label for="realestate">
      不動産の購入や売却を検討されていますか（任意）
    </label>

    <select id="realestate" name="realestate">
      <option value="">選択してください</option>
      <option>検討している</option>
      <option>検討していない</option>
      <option>将来的に検討するかも</option>
    </select>

    <button id="submitButton" type="submit">
      送信する
    </button>

  </form>
</div>

<div id="thankYou">

  <div class="company-logo">
    <img
      src="./logo.png"
      alt="株式会社RH Rich Happiness"
    >
  </div>

  <h2>送信ありがとうございました</h2>

  <p>
    ご入力いただいた内容を確認し、<br>
    担当者よりご案内いたします。
  </p>

</div>

<script>
const form = document.getElementById("myForm");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  submitButton.disabled = true;
  submitButton.textContent = "送信中です…";

  const data = new FormData(form);

  try {
    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbxooGYEGWQ2-Mj1bi-U7AN_S7xwoLqu7YRg79OddV9XEzz1sISf0RQVyL1C6UZC70P-/exec",
      {
        method: "POST",
        body: data
      }
    );

    const text = await response.text();

    if (
      response.ok &&
      (text.includes("OK") || text.trim() === "")
    ) {
      document.getElementById("formArea").style.display = "none";
      document.getElementById("thankYou").style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } else {
      throw new Error(text || "送信処理でエラーが発生しました");
    }

  } catch (error) {
    alert(
      "送信に失敗しました。\n" +
      "時間をおいて再度お試しいただくか、担当者へご連絡ください。"
    );

    submitButton.disabled = false;
    submitButton.textContent = "送信する";

    console.error(error);
  }
});
</script>

</body>
</html>
